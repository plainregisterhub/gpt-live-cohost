<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Live Co-Host</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body><main><h1>GPT Live Co-Host</h1><p>Manual AI reply test console. Live integrations are not connected.</p><label for="message">Viewer message</label><textarea id="message" maxlength="1000" placeholder="Type a test chat message"></textarea><p id="count">0 / 1000</p><button id="generate">Generate reply</button><p id="error" hidden></p><h2>AI reply</h2><p id="reply">Your reply will appear here.</p><button id="speak">Play voice</button><button id="stop">Stop</button><button id="copy">Copy</button><p id="status">Checking server…</p><script>document.querySelector('#message').addEventListener('input',e=>document.querySelector('#count').textContent=e.target.value.length+' / 1000');</script></main></body></html>
